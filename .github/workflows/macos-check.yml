# A macOS box without the Mac. Runs the Rust tests on Apple Silicon, starts a
# debug build of the app, and keeps a screenshot and the app's logs as the
# run's artifact. No Houdini is installed here, so the app shows its no-install
# state; F1 into a real Houdini still needs a real Mac.
#
# A dispatch can run a check instead of the screenshot, with the built app at
# ./src-tauri/target/debug/houdinimd and `out/` kept as the artifact:
#   gh workflow run macos-check.yml -f run="bash harness/mac/zoom-french.sh"
#   gh run download <id> -n macos-check
name: macos-check

on:
  workflow_dispatch:
    inputs:
      run:
        description: A command to run on the Mac after the build
        default: ""
  push:
    branches: [main]
    paths: ["src-tauri/**", "src/**", ".github/workflows/macos-check.yml"]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install

      # `generate_context!` reads `dist/` at compile time, tests included.
      - run: bun run build

      - name: test
        working-directory: src-tauri
        run: cargo test --workspace

      # `--debug` still bundles the front end into the binary, so it runs
      # without a dev server.
      - name: build
        run: bun run tauri build --debug --no-bundle

      - name: run the dispatched check
        if: inputs.run != ''
        # `shell: bash` adds pipefail: a failed check fails the step, not tee.
        shell: bash
        env:
          RUN: ${{ inputs.run }}
        run: |
          mkdir -p out
          bash -c "$RUN" 2>&1 | tee out/run.log

      - name: start the app and take a screenshot
        if: inputs.run == ''
        run: |
          mkdir out
          ./src-tauri/target/debug/houdinimd > out/stdout.log 2>&1 &
          sleep 30
          screencapture -x out/screen.png
          kill $! || true
          cp -R ~/Library/Application\ Support/*/logs out/app-logs 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-check
          path: out/
