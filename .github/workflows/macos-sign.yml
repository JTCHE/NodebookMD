# Adds the macOS build to a draft release. The app and its disk image are built
# on a Mac by hand (the GitHub macOS runner costs money) and uploaded to the
# draft. This job signs the updater tarball with the updater key and adds the
# darwin-aarch64 entry to `latest.json`.
#   gh workflow run macos-sign.yml -f tag=v0.3.1
name: macos-sign

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, e.g. v0.3.1
        required: true

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: oven-sh/setup-bun@v2

      - name: sign the updater tarball
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern '*.app.tar.gz'
          bunx @tauri-apps/cli@2 signer sign *.app.tar.gz

      - name: add the macOS platform to latest.json
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --output latest.json
          tarball=$(ls *.app.tar.gz)
          url="https://github.com/$REPO/releases/latest/download/$tarball"
          signature=$(cat "$tarball.sig")
          jq --arg url "$url" --arg sig "$signature" \
            '.platforms["darwin-aarch64"] = {"signature": $sig, "url": $url}' \
            latest.json > latest.new.json
          mv latest.new.json latest.json
          jq -r '.version, (.platforms | keys | join(", "))' latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
