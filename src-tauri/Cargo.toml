[workspace]
members = ["crates/engine", "crates/wiki"]

[package]
name = "houdinimd"
version = "0.2.2"
description = "Version-exact Houdini documentation, offline and local."
authors = ["JTCHE"]
edition = "2024"
rust-version = "1.90"

[lib]
# The desktop binary and any future test harness both link this.
name = "houdinimd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# `deep-link` hands a link that starts a second process to the first one.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
wiki = { version = "0.1.0", path = "crates/wiki" }
engine = { version = "0.1.0", path = "crates/engine" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rayon = "1.12.0"
tiny_http = "0.12.0"
include_dir = "0.7.4"
tauri-plugin-dialog = "2.7.3"
# The same client and TLS stack the updater already links, so telemetry adds
# no second one.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Foundation"] }
winreg = "0.56.0"
# The versions Tauri's own webview already links, for the WebView2 calls Tauri
# does not make: the memory level of a hidden window (`tray.rs`), and the item
# in the right-click menu (`context_menu.rs`).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com"] }
windows-core = "0.62"
